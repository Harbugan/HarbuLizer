name: HarbuLizer checks and NordicWay deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbulizer-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files and inline JavaScript
        run: |
          set -euo pipefail
          test -s index.html
          test -s logo.png
          test -s player-integration.js
          node --check player-integration.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.inside=False; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and not dict(attrs).get('src'): self.inside=True; self.scripts.append('')
              def handle_endtag(self, tag):
                  if tag == 'script': self.inside=False
              def handle_data(self, data):
                  if self.inside: self.scripts[-1]+=data
          p=Scripts()
          with open('index.html',encoding='utf-8') as f: p.feed(f.read())
          assert p.scripts, 'Missing inline JS'
          for i,script in enumerate(p.scripts):
              with open('/tmp/harbulizer-inline-'+str(i)+'.js','w') as f: f.write(script)
          PY
          for script in /tmp/harbulizer-inline-*.js; do node --check "$script"; done

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload HarbuLizer files to isolated project directory
        env:
          FTP_USER: ${{ secrets.NORDICWAY_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NORDICWAY_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          for file in index.html logo.png player-integration.js; do
            curl --fail --show-error --silent --retry 2 --ssl-reqd --ftp-pasv \
              --user "$FTP_USER:$FTP_PASSWORD" --upload-file "$file" \
              "ftp://cp17.nordicway.dk//public_html/Projects/HarbuLizer/$file"
          done
          echo "HarbuLizer deploy complete; no remote deletions."
